name: Feature request
description: Propose a product or engineering improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem should this feature solve?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List measurable completion criteria.
    validations:
      required: true
  - type: textarea
    id: technical-notes
    attributes:
      label: Technical notes
      description: Architecture, migration, security, or testing considerations.
