name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate tag and release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)"
          TAG="${GITHUB_REF_NAME}"
          EXPECTED_TAG="v${VERSION}"
          NOTES_FILE="docs/releases/${TAG}.md"

          if [[ "${VERSION}" == *-SNAPSHOT ]]; then
            echo "Release tags cannot publish a snapshot version: ${VERSION}." >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "Tag commit ${GITHUB_SHA} is not reachable from origin/main." >&2
            exit 1
          fi

          if [[ "${TAG}" != "${EXPECTED_TAG}" ]]; then
            echo "Tag ${TAG} does not match Maven version ${VERSION}." >&2
            exit 1
          fi

          if [[ ! -f "${NOTES_FILE}" ]]; then
            echo "Release notes were not found: ${NOTES_FILE}" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "notes_file=${NOTES_FILE}" >> "${GITHUB_OUTPUT}"

      - name: Verify
        run: ./mvnw -B -ntp clean verify

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.metadata.outputs.version }}"
          JAR_NAME="payflow-${VERSION}.jar"
          JAR_PATH="target/${JAR_NAME}"
          CHECKSUM_PATH="target/${JAR_NAME}.sha256"

          if [[ ! -f "${JAR_PATH}" ]]; then
            echo "Release JAR was not found: ${JAR_PATH}" >&2
            exit 1
          fi

          (
            cd target
            sha256sum "${JAR_NAME}" > "${JAR_NAME}.sha256"
          )

          test -s "${CHECKSUM_PATH}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: payflow-${{ steps.metadata.outputs.version }}
          path: |
            target/payflow-${{ steps.metadata.outputs.version }}.jar
            target/payflow-${{ steps.metadata.outputs.version }}.jar.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.metadata.outputs.version }}"
          JAR_PATH="target/payflow-${VERSION}.jar"
          CHECKSUM_PATH="${JAR_PATH}.sha256"

          gh release create "${GITHUB_REF_NAME}" \
            "${JAR_PATH}#PayFlow ${VERSION} executable JAR" \
            "${CHECKSUM_PATH}#SHA-256 checksum" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "PayFlow ${GITHUB_REF_NAME}" \
            --notes-file "${{ steps.metadata.outputs.notes_file }}" \
            --verify-tag
