name: Docker Smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GRAFANA_ADMIN_PASSWORD: payflow-smoke-local-only

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Start production-profile stack
        shell: bash
        run: |
          mkdir -p .runtime/jwt

          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:2048 \
            -out .runtime/jwt/active-private.pem

          openssl pkey \
            -in .runtime/jwt/active-private.pem \
            -pubout \
            -out .runtime/jwt/active-public.pem

          chmod 0400 .runtime/jwt/active-private.pem
          chmod 0444 .runtime/jwt/active-public.pem
          sudo chown -R 10001:10001 .runtime/jwt

          export JWT_KEY_DIRECTORY="$GITHUB_WORKSPACE/.runtime/jwt"
          echo "JWT_KEY_DIRECTORY=$JWT_KEY_DIRECTORY" \
            >> "$GITHUB_ENV"

          cat > /tmp/payflow-smoke.override.yml <<'YAML'
          services:
            app:
              environment:
                SPRING_PROFILES_ACTIVE: production
                JWT_ACTIVE_KEY_ID: smoke-active-2026-08
                JWT_ACTIVE_PRIVATE_KEY_LOCATION: file:/run/secrets/payflow/jwt/active-private.pem
                JWT_ACTIVE_PUBLIC_KEY_LOCATION: file:/run/secrets/payflow/jwt/active-public.pem
              volumes:
                - ${JWT_KEY_DIRECTORY:?JWT_KEY_DIRECTORY must be set}:/run/secrets/payflow/jwt:ro
          YAML

          docker compose \
            -f compose.yml \
            -f /tmp/payflow-smoke.override.yml \
            --profile app \
            up -d --build postgres redis kafka app

      - name: Verify health, correlation, and JSON completion log
        shell: bash
        run: |
          healthy=false

          for attempt in $(seq 1 75); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --dump-header /tmp/payflow-headers.txt \
              --output /tmp/payflow-health.json \
              http://localhost:8080/api/v1/system/health; then
              healthy=true
              break
            fi

            sleep 2
          done

          test "$healthy" = "true"
          test -s /tmp/payflow-health.json

          correlation_id="$(
            awk '
              BEGIN { IGNORECASE = 1 }
              /^X-Correlation-ID:/ {
                sub(/\r$/, "", $2)
                print $2
              }
            ' /tmp/payflow-headers.txt
          )"

          test -n "$correlation_id"
          test "${#correlation_id}" -le 64

          docker compose \
            -f compose.yml \
            -f /tmp/payflow-smoke.override.yml \
            --profile app \
            logs --no-color app \
            > /tmp/payflow-app.log

          grep -F '"event":"http.request.completed"' /tmp/payflow-app.log
          grep -F "\"correlationId\":\"$correlation_id\"" /tmp/payflow-app.log
          grep -F '"http.route":"/api/v1/system/health"' /tmp/payflow-app.log
          grep -F '"outcome":"SUCCESS"' /tmp/payflow-app.log

      - name: Print stack logs on failure
        if: failure()
        run: |
          if [[ ! -f /tmp/payflow-smoke.override.yml ]]; then
            echo "Smoke override was not created; no stack logs are available."
            exit 0
          fi

          docker compose \
            -f compose.yml \
            -f /tmp/payflow-smoke.override.yml \
            --profile app \
            ps

          docker compose \
            -f compose.yml \
            -f /tmp/payflow-smoke.override.yml \
            --profile app \
            logs --no-color

      - name: Tear down
        if: always()
        run: |
          if [[ ! -f /tmp/payflow-smoke.override.yml ]]; then
            echo "Smoke override was not created; no stack teardown is required."
            exit 0
          fi

          docker compose \
            -f compose.yml \
            -f /tmp/payflow-smoke.override.yml \
            --profile app \
            down -v --remove-orphans
