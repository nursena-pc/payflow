spring:
  application:
    name: payflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payflow}
    username: ${DB_USERNAME:payflow}
    password: ${DB_PASSWORD:payflow}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        "[enable.idempotence]": true
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:payflow}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLED:false}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_SMTP_READ_TIMEOUT_MS:5000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT_MS:5000}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

payflow:
  security:
    jwt:
      issuer: https://api.payflow.local
      access-token-ttl: 15m
      key-set:
        provider-mode: ${JWT_KEY_PROVIDER_MODE:ephemeral}
        active-key-id: ${JWT_ACTIVE_KEY_ID:local-development}
        active-private-key-location: ${JWT_ACTIVE_PRIVATE_KEY_LOCATION:}
        active-public-key-location: ${JWT_ACTIVE_PUBLIC_KEY_LOCATION:}
        previous-key-id: ${JWT_PREVIOUS_KEY_ID:}
        previous-public-key-location: ${JWT_PREVIOUS_PUBLIC_KEY_LOCATION:}
    refresh-session:
      refresh-token-ttl: ${REFRESH_TOKEN_TTL:7d}
      family-ttl: ${REFRESH_TOKEN_FAMILY_TTL:30d}
    account-action:
      email-verification-ttl: ${ACCOUNT_ACTION_EMAIL_VERIFICATION_TTL:24h}
      password-recovery-ttl: ${ACCOUNT_ACTION_PASSWORD_RECOVERY_TTL:30m}
      email-verification-confirmation-uri: ${ACCOUNT_ACTION_EMAIL_VERIFICATION_CONFIRMATION_URI:https://app.payflow.local/verify-email}
      password-recovery-confirmation-uri: ${ACCOUNT_ACTION_PASSWORD_RECOVERY_CONFIRMATION_URI:https://app.payflow.local/recover-password}
    mfa:
      totp:
        issuer: ${MFA_TOTP_ISSUER:PayFlow}
        enrollment-ttl: ${MFA_ENROLLMENT_TTL:10m}
      login-challenge:
        ttl: ${MFA_LOGIN_CHALLENGE_TTL:5m}
        max-attempts: ${MFA_LOGIN_CHALLENGE_MAX_ATTEMPTS:5}
      secret-protection:
        provider-mode: ${MFA_SECRET_PROTECTION_MODE:ephemeral}
        key-base64: ${MFA_SECRET_ENCRYPTION_KEY:}
    login-rate-limit:
      enabled: ${LOGIN_RATE_LIMIT_ENABLED:true}
      window: ${LOGIN_RATE_LIMIT_WINDOW:15m}
      identity-limit: ${LOGIN_RATE_LIMIT_IDENTITY_LIMIT:5}
      client-limit: ${LOGIN_RATE_LIMIT_CLIENT_LIMIT:20}
    client-context:
      trusted-proxy-cidrs: ${TRUSTED_PROXY_CIDRS:}
      max-forwarded-header-length: ${FORWARDED_HEADER_MAX_LENGTH:4096}
      max-forwarded-hops: ${FORWARDED_MAX_HOPS:16}
  mail:
    content-protection:
      provider-mode: ${MAIL_CONTENT_PROTECTION_MODE:ephemeral}
      key-base64: ${MAIL_CONTENT_ENCRYPTION_KEY:}
    delivery:
      from-address: ${MAIL_FROM_ADDRESS:no-reply@payflow.local}
      from-name: ${MAIL_FROM_NAME:PayFlow}
    outbox:
      retry:
        max-attempts: ${MAIL_OUTBOX_RETRY_MAX_ATTEMPTS:5}
        initial-delay: ${MAIL_OUTBOX_RETRY_INITIAL_DELAY:30s}
        maximum-delay: ${MAIL_OUTBOX_RETRY_MAXIMUM_DELAY:10m}
      polling:
        enabled: ${MAIL_OUTBOX_POLLING_ENABLED:false}
        worker-id: ${MAIL_OUTBOX_WORKER_ID:${HOSTNAME:payflow-mail-local}}
        batch-size: ${MAIL_OUTBOX_POLLING_BATCH_SIZE:50}
        lease-duration: ${MAIL_OUTBOX_POLLING_LEASE_DURATION:30s}
        fixed-delay: ${MAIL_OUTBOX_POLLING_FIXED_DELAY:2s}
        initial-delay: ${MAIL_OUTBOX_POLLING_INITIAL_DELAY:5s}
  outbox:
    kafka:
      send-timeout: ${OUTBOX_KAFKA_SEND_TIMEOUT:10s}
    retry:
      max-attempts: ${OUTBOX_RETRY_MAX_ATTEMPTS:5}
      initial-delay: ${OUTBOX_RETRY_INITIAL_DELAY:10s}
      maximum-delay: ${OUTBOX_RETRY_MAXIMUM_DELAY:1m}
    polling:
      enabled: ${OUTBOX_POLLING_ENABLED:false}
      publisher-id: ${OUTBOX_PUBLISHER_ID:${HOSTNAME:payflow-local}}
      batch-size: ${OUTBOX_POLLING_BATCH_SIZE:100}
      lease-duration: ${OUTBOX_POLLING_LEASE_DURATION:30s}
      fixed-delay: ${OUTBOX_POLLING_FIXED_DELAY:1s}
      initial-delay: ${OUTBOX_POLLING_INITIAL_DELAY:5s}
  event-processing:
    transfer-completed:
      enabled: ${TRANSFER_COMPLETED_CONSUMER_ENABLED:false}
      topic: ${TRANSFER_COMPLETED_CONSUMER_TOPIC:wallet.transfer.completed}
      group-id: ${TRANSFER_COMPLETED_CONSUMER_GROUP:payflow-transfer-completed-audit-v1}
      consumer-name: ${TRANSFER_COMPLETED_CONSUMER_NAME:transfer-completed-audit}
      failure:
        dead-letter-topic: ${TRANSFER_COMPLETED_DLT_TOPIC:wallet.transfer.completed.dlt}
        max-retries: ${TRANSFER_COMPLETED_RETRY_MAX_RETRIES:3}
        initial-delay: ${TRANSFER_COMPLETED_RETRY_INITIAL_DELAY:500ms}
        multiplier: ${TRANSFER_COMPLETED_RETRY_MULTIPLIER:2.0}
        maximum-delay: ${TRANSFER_COMPLETED_RETRY_MAXIMUM_DELAY:5s}
        send-timeout: ${TRANSFER_COMPLETED_DLT_SEND_TIMEOUT:10s}
      dead-letter-intake:
        enabled: ${TRANSFER_COMPLETED_DLT_INTAKE_ENABLED:false}
        group-id: ${TRANSFER_COMPLETED_DLT_INTAKE_GROUP:payflow-transfer-completed-dlt-intake-v1}
      dead-letter-replay:
        worker-id: ${TRANSFER_COMPLETED_DLT_REPLAY_WORKER_ID:payflow-dlt-replay}
        lease-duration: ${TRANSFER_COMPLETED_DLT_REPLAY_LEASE_DURATION:30s}
        max-attempts: ${TRANSFER_COMPLETED_DLT_REPLAY_MAX_ATTEMPTS:3}
        send-timeout: ${TRANSFER_COMPLETED_DLT_REPLAY_SEND_TIMEOUT:10s}

---

spring:
  config:
    activate:
      on-profile: production

payflow:
  security:
    jwt:
      key-set:
        provider-mode: configured
    mfa:
      secret-protection:
        provider-mode: configured
  mail:
    content-protection:
      provider-mode: configured
